<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .map-title {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border: 2px solid #263238;
            border-radius: 5px;
            padding: 10px 20px;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #17365d;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        .north-arrow {
            position: absolute;
            top: 75px;
            right: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border: 1px solid #333;
            border-radius: 5px;
            padding: 6px 12px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            pointer-events: none;
        }

        .north-arrow .arrow {
            font-size: 36px;
            line-height: 1;
            color: #c62828;
        }

        .north-arrow .north-label {
            font-size: 16px;
            color: #111;
        }

        .leaflet-control-scale {
            margin-bottom: 20px !important;
            margin-left: 15px !important;
        }

        @media (max-width: 600px) {
            .map-title {
                top: 10px;
                font-size: 14px;
                padding: 8px;
                max-width: 70%;
                white-space: normal;
            }
        }
    </style>

    <title>Pandharpur, Solapur District</title>
</head>

<body>

    <div class="map-title">
        PANDHARPUR, SOLAPUR DISTRICT
    </div>

    <div class="north-arrow">
        <div class="north-label">N</div>
        <div class="arrow">↑</div>
    </div>

    <div id="map"></div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>

    <script src="data/pandharpurcity_1.js"></script>
    <script src="data/Hospitals_kmz_2.js"></script>
    <script src="data/pandharpur_city_road_3.js"></script>
    <script src="data/Buildings_4.js"></script>
    <script src="data/railways_5.js"></script>
    <script src="data/water_6.js"></script>
    <script src="data/Waterways_7.js"></script>
    <script src="data/pandharpur_citypandharpurcity_8.js"></script>

    <script>
        var map = L.map('map', {
            zoomControl: false,
            maxZoom: 28,
            minZoom: 1
        }).fitBounds([
            [17.657300900213393, 75.28827639996423],
            [17.706306378623488, 75.3657829725124]
        ]);

        var hash = new L.Hash(map);

        map.attributionControl.setPrefix(
            '<a href="https://github.com/qgis2web/qgis2web">qgis2web</a> | ' +
            '<a href="https://leafletjs.com">Leaflet</a> | ' +
            '<a href="https://qgis.org">QGIS</a>'
        );

        L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        // Scale Bar
        L.control.scale({
            position: 'bottomleft',
            imperial: false,
            metric: true,
            maxWidth: 150
        }).addTo(map);

        // Google Satellite Basemap
        var layer_GoogleSatellite_0 = L.tileLayer(
            'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
            {
                attribution: 'Map data © Google',
                maxZoom: 28,
                maxNativeZoom: 20
            }
        ).addTo(map);

        // City Boundary
        var layer_pandharpurcity_1 = L.geoJson(
            json_pandharpurcity_1,
            {
                style: {
                    color: '#111111',
                    weight: 3,
                    fillOpacity: 0
                }
            }
        ).addTo(map);

        // Hospitals
        var layer_Hospitals_kmz_2 = L.geoJson(
            json_Hospitals_kmz_2,
            {
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 5,
                        color: '#222222',
                        weight: 1,
                        fillColor: '#c9d94e',
                        fillOpacity: 1
                    });
                },
                onEachFeature: function (feature, layer) {
                    if (feature.properties && feature.properties.name) {
                        layer.bindPopup(
                            '<b>Hospital:</b> ' + feature.properties.name
                        );
                    }
                }
            }
        ).addTo(map);

        // Roads
        var layer_pandharpur_city_road_3 = L.geoJson(
            json_pandharpur_city_road_3,
            {
                style: {
                    color: '#e5b636',
                    weight: 1
                },
                onEachFeature: function (feature, layer) {
                    if (feature.properties && feature.properties.name) {
                        layer.bindPopup(
                            '<b>Road:</b> ' + feature.properties.name
                        );
                    }
                }
            }
        ).addTo(map);

        // Buildings
        var layer_Buildings_4 = L.geoJson(
            json_Buildings_4,
            {
                style: {
                    color: '#555555',
                    weight: 1,
                    fillColor: '#beb297',
                    fillOpacity: 0.8
                }
            }
        ).addTo(map);

        // Railways
        var layer_railways_5 = L.geoJson(
            json_railways_5,
            {
                style: {
                    color: '#7d8b8f',
                    weight: 2
                }
            }
        ).addTo(map);

        // Water Bodies
        var layer_water_6 = L.geoJson(
            json_water_6,
            {
                style: {
                    color: '#477fa8',
                    weight: 1,
                    fillColor: '#8ecae6',
                    fillOpacity: 0.8
                }
            }
        ).addTo(map);

        // Waterways
        var layer_Waterways_7 = L.geoJson(
            json_Waterways_7,
            {
                style: {
                    color: '#729b6f',
                    weight: 2
                }
            }
        ).addTo(map);

        // Additional City Boundary Data
        var layer_pandharpur_citypandharpurcity_8 = L.geoJson(
            json_pandharpur_citypandharpurcity_8,
            {
                style: {
                    color: '#e31a1c',
                    weight: 2,
                    fillOpacity: 0
                }
            }
        ).addTo(map);

        // Layer Control
        var overlaysTree = [
            {
                label: 'Pandharpur City Boundary',
                layer: layer_pandharpurcity_1
            },
            {
                label: 'Hospitals',
                layer: layer_Hospitals_kmz_2
            },
            {
                label: 'Roads',
                layer: layer_pandharpur_city_road_3
            },
            {
                label: 'Buildings',
                layer: layer_Buildings_4
            },
            {
                label: 'Railways',
                layer: layer_railways_5
            },
            {
                label: 'Water Bodies',
                layer: layer_water_6
            },
            {
                label: 'Waterways',
                layer: layer_Waterways_7
            },
            {
                label: 'Additional City Boundary',
                layer: layer_pandharpur_citypandharpurcity_8
            },
            {
                label: 'Google Satellite',
                layer: layer_GoogleSatellite_0
            }
        ];

        L.control.layers.tree(null, overlaysTree, {
            collapsed: true
        }).addTo(map);

    </script>
</body>
</html>
